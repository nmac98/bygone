{% extends "base.html" %}
{% block title %}Admin | New Chapter{% endblock %}

{% block content %}
<div class="admin-container">
  <h1>New Chapter</h1>
  <p class="text-muted">Location: <strong>{{ location.name }}</strong></p>

  <form method="POST">
    <div class="form-group">
      <label>Title *</label>
      <input class="form-control" type="text" name="title" required>
    </div>

    <div class="form-group">
      <label>Summary (optional)</label>
      <textarea class="form-control" name="summary" rows="4"></textarea>
    </div>

    <div class="form-group">
      <label>Sort Order</label>
      <input class="form-control" type="number" name="sort_order" value="0">
      <small class="text-muted">Lower numbers appear first.</small>
    </div>

    <div style="margin-top: 1rem;">
      <button class="btn btn-primary" type="submit">Create Chapter</button>
      <a class="btn btn-secondary"
         href="{{ url_for('admin.chapters_for_location', location_id=location.id) }}">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
