{% extends "base.html" %}
{% block title %}Edit Image{% endblock %}

{% block content %}
<div class="admin-container">
  <h1>Edit Image</h1>

  {% if original %}
    <div style="margin-bottom:16px;">
      <img src="{{ original.public_url }}" style="max-width:300px; height:auto; border-radius:8px;">
    </div>
  {% endif %}

  <form method="POST" enctype="multipart/form-data">
    <div class="form-group">
      <label>Replace file (optional)</label>
      <input type="file" name="file" class="form-control">
    </div>

    <div class="form-group">
      <label>Title / Name</label>
      <input type="text" name="title" value="{{ img.title or '' }}" class="form-control">
    </div>

    <div class="form-group">
      <label>Date</label>
      <input type="text" name="date" value="{{ img.date or '' }}" class="form-control">
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea name="description" class="form-control">{{ img.description or '' }}</textarea>
    </div>

    <div class="form-group">
      <label>Location</label>
      <select name="location_id" class="form-control">
        <option value="">-- None --</option>
        {% for loc in locations %}
          <option value="{{ loc.id }}" {% if loc.id == current_location_id %}selected{% endif %}>
            {{ loc.name }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="lat">Latitude</label>
      <input type="text" id="lat" name="lat" value="{{ lat_val }}" class="form-control">
    </div>

    <div class="form-group">
      <label for="lon">Longitude</label>
      <input type="text" id="lon" name="lon" value="{{ lon_val }}" class="form-control">
    </div>

    <h3>GPS Location</h3>
    <p>Click on the map to set the latitude and longitude.</p>

    <div id="photo-map" style="height:300px; border-radius:10px; overflow:hidden; margin-bottom:16px;"></div>

    <div style="margin-bottom:16px;">
      <button type="button" id="update-map" class="btn btn-secondary">Update Map from Lat/Lon</button>
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('admin.images_list') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>

<script>
  const defaultLat = 53.3498;
  const defaultLon = -6.2603;

  {% if image %}
      const existingLat = {{ image.lat if image.lat is not none else 'null' }};
      const existingLon = {{ image.lon if image.lon is not none else 'null' }};
  {% else %}
      const existingLat = null;
      const existingLon = null;
  {% endif %}

  const startLat = existingLat !== null ? existingLat : defaultLat;
  const startLon = existingLon !== null ? existingLon : defaultLon;

  const map = L.map('photo-map').setView([startLat, startLon], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  let marker = null;

  function setMarkerAndInputs(lat, lon) {
    if (marker) {
      marker.setLatLng([lat, lon]);
    } else {
      marker = L.marker([lat, lon]).addTo(map);
    }
    document.getElementById('lat').value = lat.toFixed(6);
    document.getElementById('lon').value = lon.toFixed(6);
  }

  if (existingLat !== null && existingLon !== null) {
    setMarkerAndInputs(existingLat, existingLon);
  }

  map.on('click', function(e) {
    const lat = e.latlng.lat;
    const lon = e.latlng.lng;
    setMarkerAndInputs(lat, lon);
  });

  document.getElementById('update-map').addEventListener('click', function() {
    const latVal = parseFloat(document.getElementById('lat').value);
    const lonVal = parseFloat(document.getElementById('lon').value);
    if (!isNaN(latVal) && !isNaN(lonVal)) {
      setMarkerAndInputs(latVal, lonVal);
      map.setView([latVal, lonVal], 15);
    }
  });
</script>

{% endblock %}
