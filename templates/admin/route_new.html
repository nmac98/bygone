{% extends "base.html" %}
{% block title %}Admin | New Route{% endblock %}

{% block content %}
<div class="admin-container">
  <h1>Create New Route</h1>

  <form method="POST">
    <div class="form-group">
      <label for="id">Route ID (string)</label>
      <input type="text" name="id" id="id" required class="form-control"
             placeholder="e.g. parkgate_route">
    </div>

    <div class="form-group">
      <label for="name">Route Name</label>
      <input type="text" name="name" id="name" required class="form-control">
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea name="description" id="description" rows="4" class="form-control"></textarea>
    </div>

    <div class="form-group">
      <label>Route type</label>
      <div class="block-type-tabs" style="margin-top:6px;">
        <label class="block-type-tab">
          <input type="radio" name="route_type" value="walking" checked>
          <span>🚶 Walking</span>
        </label>
        <label class="block-type-tab">
          <input type="radio" name="route_type" value="running">
          <span>🏃 Running</span>
        </label>
      </div>
    </div>

    <div class="form-group">
      <label>Cover Image</label>
      <input type="hidden" name="cover_image" id="cover_image" value="">
      <div class="image-picker">
        {% for img in images %}
        <div class="image-picker-item" onclick="selectCoverImage('{{ img }}')" data-filename="{{ img }}">
          <img src="{{ url_for('static', filename='images/' + img) }}" alt="{{ img }}">
          <span>{{ img }}</span>
        </div>
        {% endfor %}
      </div>
      <small class="text-muted">Click an image to select it as the cover. Leave unselected to use the default.</small>
    </div>

    <button type="submit" class="btn btn-primary">Create Route</button>
    <a href="{{ url_for('admin.admin_routes') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>

<script>
function selectCoverImage(filename) {
  document.getElementById('cover_image').value = filename;
  document.querySelectorAll('.image-picker-item').forEach(el => el.classList.remove('selected'));
  document.querySelector(`.image-picker-item[data-filename="${filename}"]`).classList.add('selected');
}
</script>
{% endblock %}
