{% extends "base.html" %}
{% block title %}Admin | Edit Route{% endblock %}

{% block content %}
<div class="admin-container">
  <h1>Edit Route: {{ route.name }}</h1>

  <form method="POST">
    <div class="form-group">
      <label>ID</label>
      <input type="text" class="form-control" value="{{ route.id }}" disabled>
      <small class="text-muted">ID cannot be changed.</small>
    </div>

    <div class="form-group">
      <label for="name">Route Name</label>
      <input type="text" name="name" id="name" value="{{ route.name }}" required class="form-control">
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea name="description" id="description" rows="4" class="form-control">{{ route.description }}</textarea>
    </div>

    <div class="form-group">
      <label>Cover Image</label>
      <input type="hidden" name="cover_image" id="cover_image" value="{{ route.cover_image or '' }}">
      <div class="image-picker">
        {% for img in images %}
        <div class="image-picker-item {% if route.cover_image == img %}selected{% endif %}"
             onclick="selectCoverImage('{{ img }}')" data-filename="{{ img }}">
          <img src="{{ url_for('static', filename='images/' + img) }}" alt="{{ img }}">
          <span>{{ img }}</span>
        </div>
        {% endfor %}
      </div>
      <small class="text-muted">Click an image to select it as the cover. Leave unselected to use the default.</small>
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('admin.admin_routes') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>

<script>
function selectCoverImage(filename) {
  document.getElementById('cover_image').value = filename;
  document.querySelectorAll('.image-picker-item').forEach(el => el.classList.remove('selected'));
  document.querySelector(`.image-picker-item[data-filename="${filename}"]`).classList.add('selected');
}
</script>
{% endblock %}
