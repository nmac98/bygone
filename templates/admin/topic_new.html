{% extends "base.html" %}
{% block title %}Admin | New Topic{% endblock %}

{% block content %}
<div class="admin-container">
  <h1>New Topic</h1>
  <p class="text-muted">
    Topics can be attached to multiple chapters as “Find out more” links.
  </p>

  <form method="POST">
    <div class="form-group">
      <label>Slug *</label>
      <input class="form-control" type="text" name="slug" required placeholder="flight-of-the-earls">
      <small class="text-muted">Use lowercase and hyphens.</small>
    </div>

    <div class="form-group">
      <label>Title *</label>
      <input class="form-control" type="text" name="title" required placeholder="Flight of the Earls">
    </div>

    <div class="form-group">
      <label>Summary (optional)</label>
      <textarea class="form-control" name="summary" rows="4"
                placeholder="Short description shown later (optional)..."></textarea>
    </div>

    <div class="form-group">
      <label>Default URL *</label>
      <input class="form-control" type="text" name="default_url" required
             placeholder="https://en.wikipedia.org/wiki/Flight_of_the_Earls">
    </div>

    <div style="margin-top: 1rem;">
      <button class="btn btn-primary" type="submit">Create Topic</button>
      <a class="btn btn-secondary" href="{{ url_for('admin.topics_list') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
