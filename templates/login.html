<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BYGONE | Admin Login</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0a0a0a;
            color: #ccc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 360px;
            padding: 40px 32px;
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
        }

        .login-logo {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: #fff;
            margin-bottom: 6px;
        }

        .login-subtitle {
            font-size: 0.8rem;
            color: #555;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: #777;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            padding: 10px 12px;
            outline: none;
            transition: border-color 0.15s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #2E7D52;
        }

        .password-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrap input {
            padding-right: 56px;
        }

        .toggle-pw {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            color: #555;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            padding: 4px;
            transition: color 0.15s;
        }

        .toggle-pw:hover {
            color: #aaa;
        }

        .error-msg {
            font-size: 0.8rem;
            color: #c0392b;
            margin-bottom: 16px;
        }

        .submit-btn {
            width: 100%;
            margin-top: 8px;
            padding: 11px;
            background: #2E7D52;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .submit-btn:hover {
            background: #3da366;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">BYGONE</div>
        <div class="login-subtitle">Admin Access</div>

        {% if error %}
        <p class="error-msg">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" autofocus>
            </div>

            <div class="form-group">
                <label for="password-input">Password</label>
                <div class="password-wrap">
                    <input type="password" id="password-input" name="password" autocomplete="current-password">
                    <button
                        type="button"
                        class="toggle-pw"
                        onclick="const i=document.getElementById('password-input'); i.type=i.type==='password'?'text':'password'; this.textContent=i.type==='password'?'Show':'Hide';"
                    >Show</button>
                </div>
            </div>

            <button type="submit" class="submit-btn">Log in</button>
        </form>
    </div>
</body>
</html>
