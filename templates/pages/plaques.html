{% extends "base.html" %}

{% block title %}BYGONE | Plaques{% endblock %}

{% block content %}
<div class="plaques-page">

  <!-- Camera prompt -->
  <div id="plaques-prompt" class="plaques-prompt">
    <div class="plaques-icon">🏛</div>
    <h2 class="plaques-title">Scan a Plaque</h2>
    <p class="plaques-instruction">Take a photo of any historical plaque to learn about the person or event it commemorates.</p>
    <label for="plaque-input" class="sheet-btn plaques-camera-btn">
      Take Photo
    </label>
    <input type="file" id="plaque-input" accept="image/*" capture="environment" style="display:none;">
  </div>

  <!-- Loading state -->
  <div id="plaques-loading" class="plaques-loading">
    <div class="plaques-spinner"></div>
    <p class="plaques-loading-text">Analysing plaque...</p>
  </div>

  <!-- Error state -->
  <div id="plaques-error" class="plaques-error">
    <p id="plaques-error-msg" class="plaques-error-msg"></p>
    <button class="sheet-btn" onclick="resetPlaques()">Try Again</button>
  </div>

  <!-- Full-page result -->
  <div id="plaques-result" class="plaques-result">
  <img id="plaque-result-img" class="plaque-result-img" src="" alt="">
  <div class="plaque-result-body">
    <h2 id="plaque-result-name" class="plaque-result-name"></h2>
    <p id="plaque-result-summary" class="plaque-result-summary"></p>
    <div id="plaque-works-section" class="plaque-works-section" style="display:none">
      <h3 class="plaque-works-title">Notable works</h3>
      <div id="plaque-works-grid" class="plaque-works-grid"></div>
    </div>
    <a id="plaque-wiki-link" class="plaque-wiki-link" href="#" target="_blank" rel="noopener" style="display:none">
      Read more on Wikipedia →
    </a>
    <button class="sheet-btn plaque-result-btn" onclick="resetPlaques()">Scan another</button>
  </div>
</div> <!-- end .plaques-page -->

<script>
  const input = document.getElementById('plaque-input');

  input.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    showLoading();

    const formData = new FormData();
    formData.append('image', file);

    try {
      const res = await fetch('/plaques/analyze', {
        method: 'POST',
        body: formData
      });

      const data = await res.json();

      if (data.error) {
        showError(data.error);
      } else {
        showResult(file, data);
      }
    } catch (err) {
      showError('Something went wrong. Please try again.');
    }
  });

  function showLoading() {
    document.getElementById('plaques-prompt').classList.remove('active');
    document.getElementById('plaques-loading').classList.add('active');
    document.getElementById('plaques-error').classList.remove('active');
  }

  function showError(msg) {
    document.getElementById('plaques-loading').classList.remove('active');
    document.getElementById('plaques-prompt').classList.remove('active');
    document.getElementById('plaques-error').classList.add('active');
    document.getElementById('plaques-error-msg').textContent = msg;
  }

  function showResult(file, data) {
    document.getElementById('plaques-loading').classList.remove('active');

    document.getElementById('plaque-result-img').src = URL.createObjectURL(file);
    document.getElementById('plaque-result-name').textContent = data.name || '';
    document.getElementById('plaque-result-summary').textContent = data.summary || '';

    const worksSection = document.getElementById('plaque-works-section');
    const worksGrid = document.getElementById('plaque-works-grid');
    worksGrid.innerHTML = '';
    worksSection.style.display = 'none';

    if (data.works && data.works.length > 0) {
      worksSection.style.display = 'block';
      data.works.forEach(title => fetchWorkCard(title, worksGrid));
    }

    const wikiLink = document.getElementById('plaque-wiki-link');
    wikiLink.style.display = 'none';
    if (data.name) fetchWikipediaLink(data.name, wikiLink);

    document.getElementById('plaques-result').classList.add('active');
  }

  async function fetchWikipediaLink(name, linkEl) {
    try {
      const res = await fetch(
        'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(name),
        { headers: { 'Accept': 'application/json' } }
      );
      if (!res.ok) return;
      const data = await res.json();
      const url = data.content_urls?.desktop?.page;
      if (url) {
        linkEl.href = url;
        linkEl.style.display = 'inline-block';
      }
    } catch { /* no link if lookup fails */ }
  }

  async function fetchWorkCard(title, container) {
    const card = document.createElement('div');
    card.className = 'plaque-work-card plaque-work-card--loading';
    card.innerHTML = '<div class="plaque-work-thumb-placeholder"></div><span class="plaque-work-label">' + title + '</span>';
    container.appendChild(card);

    try {
      const res = await fetch(
        'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title),
        { headers: { 'Accept': 'application/json' } }
      );
      const data = await res.json();
      const thumb = data.thumbnail?.source;

      card.classList.remove('plaque-work-card--loading');
      if (thumb) {
        card.innerHTML =
          '<img class="plaque-work-thumb" src="' + thumb + '" alt="' + title + '">' +
          '<span class="plaque-work-label">' + title + '</span>';
      } else {
        card.innerHTML =
          '<div class="plaque-work-thumb-placeholder"></div>' +
          '<span class="plaque-work-label">' + title + '</span>';
      }
    } catch {
      card.classList.remove('plaque-work-card--loading');
    }
  }

  function resetPlaques() {
    document.getElementById('plaques-result').classList.remove('active');
    document.getElementById('plaques-error').classList.remove('active');
    document.getElementById('plaques-prompt').classList.add('active');
    document.getElementById('plaque-input').value = '';
  }

  // Show prompt on load
  document.getElementById('plaques-prompt').classList.add('active');
</script>
{% endblock %}
