{% extends "base.html" %}

{% block title %}BYGONE | Home{% endblock %}

{% block content %}
<div class="landing-hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
        <img src="{{ url_for('static', filename='images/logo_large.png') }}" alt="BYGONE" class="hero-logo">
        <p class="hero-tagline">Exploring Dublin's past, street by street</p>
        <div class="hero-cta">
            <a class="cta-btn primary" href="{{ url_for('main.explore') }}">Explore the Map</a>
            <a class="cta-btn" href="{{ url_for('main.tours') }}">Tours</a>
            <a class="cta-btn" href="{{ url_for('main.plaques') }}">Plaques</a>
        </div>
    </div>
</div>
{% endblock %}
